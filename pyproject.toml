[project]
name = "jornais-new"
version = "0.1.0"
description = "Pipeline de scraping de noticias do Jornal da USP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "crawl4ai>=0.8.6,<1",
    "duckdb>=1.4.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "lxml>=5.2.2",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.50.0",
    "tenacity>=8.3.0",
    "trafilatura>=1.12.0",
]

[project.scripts]
jornais-new = "jornais_new.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
