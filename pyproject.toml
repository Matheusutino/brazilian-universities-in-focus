[project]
name = "university-news"
version = "0.1.0"
description = "Collect, process, and search news from Brazilian universities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "crawl4ai>=0.8.6,<1",
    "duckdb>=1.4.0",
    "httpx>=0.27.0",
    "lancedb>=0.25.0",
    "lingua-language-detector>=2.2.0",
    "llama-cpp-python>=0.3.20",
    "lxml>=5.2.2",
    "jsonschema>=4.23.0,<5",
    "openai>=2.0.0,<3",
    "pydantic>=2.7.0",
    "psycopg[binary]>=3.2.0,<4",
    "python-dotenv>=1.0.1",
    "tenacity>=8.3.0",
    "tqdm>=4.67.0",
    "trafilatura>=1.12.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
    "pandas>=2.2",
    "pyarrow>=17",
]

[project.scripts]
university-news = "university_news.cli:main"
university-news-all = "university_news.pipeline.runner:main"
university-news-preprocess = "university_news.pipeline.preprocessing:main"
university-news-compile = "university_news.pipeline.preprocessing:compile_main"
university-news-index = "university_news.search.vector_index:main"
university-news-analyze = "university_news.analysis.quality:main"
university-news-enrich = "university_news.enrichment.runner:main"
university-news-db = "university_news.operations.cli:main"
university-news-daily = "university_news.operations.daily:main"
university-news-worker = "university_news.operations.worker:main"
university-news-config = "university_news.settings:main"
university-news-site = "university_news.site.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/university_news"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
no-binary-package = ["llama-cpp-python"]
extra-build-variables = { llama-cpp-python = { CMAKE_ARGS = "-DGGML_CUDA=ON" } }
